<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="disc" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#EBC9A0"/>
      <stop offset="45%" stop-color="#C9A074"/>
      <stop offset="100%" stop-color="#8A5E3F"/>
    </radialGradient>
    <linearGradient id="bevel" x1="20%" y1="15%" x2="65%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Wonky-edged disc silhouette — 12 control points around a circle with
       ~10% radial noise, smoothed with quadratic curves. Matches the puff
       geometry used in the 3D scene. -->
  <path
    d="M 62.1 32 Q 56.4 46.1 47.4 58.6 Q 32 59.5 17.3 57.5 Q 8.7 45.4 1.3 32 Q 7.6 17.9 17.6 7 Q 32 1.9 45.8 8.2 Q 57.5 17.3 62.1 32 Z"
    fill="url(#disc)"
  />
  <!-- Soft bevel highlight top-left so the disc reads as 3D at favicon size -->
  <path
    d="M 62.1 32 Q 56.4 46.1 47.4 58.6 Q 32 59.5 17.3 57.5 Q 8.7 45.4 1.3 32 Q 7.6 17.9 17.6 7 Q 32 1.9 45.8 8.2 Q 57.5 17.3 62.1 32 Z"
    fill="url(#bevel)"
  />
</svg>
