<meta name="robots" content="noindex, nofollow">
<title>Flights</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0f3;--stage:#e6e9ee;--panel:#fff;--raise:#f6f7f9;
  --ink:#161a21;--ink-2:#4d5563;--ink-3:#6b7280;--line:#dfe3ea;
  --pencil:#2b5bd7;--pencil-ink:#fff;--pencil-soft:#e8eefc;
  --done:#1f7a4a;--done-soft:#e3f3ea;--danger:#b42318;--danger-soft:#fdecea;
  --clay:#b8532f;--clay-soft:#f8e9e2;
  --shadow:rgba(22,26,33,.08);--scrim:rgba(15,18,24,.28);
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --peek:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216;--stage:#0b0d11;--panel:#161a20;--raise:#1d222a;
  --ink:#e9ecf1;--ink-2:#aab2bf;--ink-3:#7d8696;--line:#272d37;
  --pencil:#7ea2ff;--pencil-ink:#0f1216;--pencil-soft:#1c2640;
  --done:#5cc98d;--done-soft:#15291f;--danger:#ff8a80;--danger-soft:#3a1b1a;
  --clay:#e08a64;--clay-soft:#33221b;
  --shadow:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1216;--stage:#0b0d11;--panel:#161a20;--raise:#1d222a;
  --ink:#e9ecf1;--ink-2:#aab2bf;--ink-3:#7d8696;--line:#272d37;
  --pencil:#7ea2ff;--pencil-ink:#0f1216;--pencil-soft:#1c2640;
  --done:#5cc98d;--done-soft:#15291f;--danger:#ff8a80;--danger-soft:#3a1b1a;
  --clay:#e08a64;--clay-soft:#33221b;
  --shadow:rgba(0,0,0,.4);--scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}
html{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.mono{font-family:var(--mono)}
.link{border:0;background:none;padding:0;color:var(--pencil);font-weight:600}
.link:hover{text-decoration:underline}

.app{box-sizing:border-box;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,34vw,460px);gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.stage{position:relative;min-width:0;min-height:0;border-radius:14px;background:var(--stage);border:1px solid var(--line);overflow:hidden}
.frame-wrap{position:absolute;inset:0}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.capture{position:absolute;inset:0;cursor:crosshair;touch-action:none;background:color-mix(in srgb,var(--pencil) 6%,transparent);box-shadow:inset 0 0 0 2px var(--pencil)}
.capture:focus{outline:none}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--stage);text-align:center}
.stage-msg>div{display:grid;gap:12px;justify-items:center;max-width:300px;color:var(--ink-2)}
.stage-msg p{margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600}

.pin{position:absolute;left:0;top:0;width:24px;height:24px;padding:0;border:0;background:none;pointer-events:auto;display:grid;place-items:center;will-change:transform}
.pin-shape{position:absolute;inset:0;box-sizing:border-box;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pencil);border:2px solid var(--panel);box-shadow:0 2px 6px var(--shadow);transition:transform .15s}
.pin-n{position:relative;font:600 11px/1 var(--mono);color:var(--pencil-ink)}
.pin-old .pin-shape{background:var(--panel);border:2px dashed var(--pencil)}
.pin-old .pin-n{color:var(--pencil)}
.pin-done .pin-shape{background:var(--done)}
.pin-draft .pin-shape{background:var(--pencil-soft);border:2px solid var(--pencil)}
.pin.hot .pin-shape,.pin:hover .pin-shape{transform:rotate(-45deg) scale(1.18)}
.pin:focus-visible{outline:none}
.pin:focus-visible .pin-shape{box-shadow:0 0 0 3px var(--pencil-soft),0 0 0 5px var(--pencil)}

.rail{position:fixed;z-index:25;left:0;top:0;bottom:0;width:48px}
.rail[hidden]{display:none}
.app.has-rail{padding-left:calc(44px + max(16px,env(safe-area-inset-left,0px)))}
.app.rail-docked{padding-left:calc(288px + max(16px,env(safe-area-inset-left,0px)))}
.rail-btn{position:absolute;left:16px;top:16px;width:28px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 2px 8px var(--shadow);color:var(--ink-2)}
.rail-btn:hover{background:var(--raise);color:var(--ink)}
.rail-btn:focus-visible{outline-offset:2px}
.rail-btn span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;line-height:1;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.rail-btn .chev{margin-top:4px;color:var(--ink-2);transition:transform .15s ease}
.rail-btn:hover .chev{transform:translateX(2px)}
.rail.docked .rail-btn{visibility:hidden}
.rail-menu{position:absolute;left:16px;top:16px;bottom:16px;box-sizing:border-box;width:272px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 2px 8px var(--shadow),0 16px 40px var(--shadow);overflow:hidden;transform:translateX(calc(-100% - 16px));visibility:hidden;transition:transform .18s ease,visibility 0s linear .18s}
.rail.open .rail-menu,.rail.docked .rail-menu{transform:none;visibility:visible;transition:transform .18s ease,visibility 0s}
.rail-head{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.rail-head .seg{display:flex;flex:1}
.rail-head .seg button{flex:1;padding:6px 10px}
.rail-hide{display:grid;place-items:center;width:30px;height:30px;margin-left:auto;border:0;border-radius:8px;background:none;color:var(--ink-3)}
.rail-hide:hover{background:var(--raise);color:var(--ink)}
.rail-list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 8px 20px}
.rail-list h2{margin:20px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.rail-list h2:first-child{margin-top:10px}
.rail-item{display:block;width:100%;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:14px;line-height:1.35;color:var(--ink)}
.rail-item:hover{background:var(--raise)}
.rail-item[aria-current="true"]{background:var(--raise);box-shadow:inset 2px 0 var(--ink);font-weight:600}
.rail-foot{margin:22px 10px 0}
.rail-foot .link{font-size:12.5px;font-weight:500;color:var(--ink-3);text-decoration:underline;text-underline-offset:2px}
.rail-foot .link:hover{color:var(--ink)}

.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px var(--shadow),0 8px 24px var(--shadow);overflow:hidden}
.panel-body{flex:1;min-height:0;display:flex;flex-direction:column}
.peek{display:none}
.scrim{display:none}

.ph{display:grid;gap:6px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph-title{margin:0;min-width:0;font-size:16px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
.ph-old{margin:0;font-size:12.5px;color:var(--clay)}
.vmenu{position:relative;flex:none}
.vbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:5px 8px;font:500 12px/1 var(--mono);color:var(--ink-2)}
.vbtn[aria-expanded="true"]{border-color:var(--pencil);color:var(--pencil)}
.vlist{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:grid;width:max-content;min-width:240px;max-width:min(320px,calc(100vw - 32px));max-height:min(60vh,420px);overflow:auto;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px var(--shadow)}
.vopt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 10px;border:0;border-radius:7px;background:none;text-align:left}
.vopt:hover,.vopt:focus-visible{background:var(--raise);outline:none}
.vopt-n{font:500 12px/1.4 var(--mono);color:var(--ink-3)}
.vopt[aria-checked="true"] .vopt-n{color:var(--pencil)}
.vopt-main{display:grid;gap:1px;min-width:0}
.vopt-title{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.vopt-meta{font-size:12px;color:var(--ink-3)}
.vnotes{font-size:13px;color:var(--ink-2)}
.vnotes summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);width:max-content;max-width:100%}
.vnotes-body{display:grid;gap:8px;padding:8px 0 2px}
.vnotes ul{margin:0;padding-left:18px;display:grid;gap:3px}
.vnotes-fixed{display:grid;gap:2px}
.vnotes-fixed button{border:0;background:none;padding:2px 0;text-align:left;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vnotes-fixed button:hover{color:var(--ink)}

.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.sbar-main{display:flex;align-items:baseline;gap:8px;min-width:0}
.sbar-title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar-count{flex:none;font:11.5px/1 var(--sans);color:var(--pencil)}
.seg{flex:none;display:inline-flex;padding:2px;border-radius:8px;background:var(--raise);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px var(--shadow)}

.notice{margin:10px 14px 0;padding:8px 12px;border-radius:8px;background:var(--raise);color:var(--ink-2);font-size:12.5px}
.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:2px;padding:6px 4px 10px}
.empty{margin:0;padding:32px 18px;text-align:center;font-size:13px;color:var(--ink-3)}
.toast{margin:0;padding:0 18px 8px;font-size:12.5px;color:var(--danger)}
.toast:empty{display:none}

.grp{display:grid;gap:2px}
.grp+.grp,.list>.shut{margin-top:8px}
.g-head{display:flex;align-items:baseline;gap:8px;width:100%;padding:8px 14px 4px;border:0;background:none;text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.g-head:hover{color:var(--ink)}
.g-head .here{color:var(--pencil);text-transform:none;letter-spacing:0;font-weight:500}

.c{display:grid;gap:6px;padding:10px 14px;border-radius:10px;transition:background .15s}
.c:hover,.c.hot{background:var(--raise)}
.c.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--pencil-soft)}100%{background:var(--raise)}}
.c-head{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.badge{flex:none;box-sizing:border-box;display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--pencil);color:var(--pencil-ink);font:600 11px/1 var(--mono)}
.badge-old{background:none;color:var(--pencil);border:1.5px dashed var(--pencil)}
.av{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);object-fit:cover}
.av-initial{display:grid;place-items:center;font:700 11px/1 var(--sans);color:var(--ink-2)}
.av-claude{display:grid;place-items:center;background:var(--clay-soft);color:var(--clay);font:700 11px/1 var(--sans)}
.c-name{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta{flex:none;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.chip{flex:none;margin-left:auto;padding:2px 8px;border-radius:999px;background:var(--done-soft);color:var(--done);font-size:11.5px;font-weight:600;white-space:nowrap}
.chip-no{background:var(--raise);color:var(--ink-3)}
.c-screen{justify-self:start;font-size:12.5px;font-weight:500}
.c-text{margin:0;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.c-shut .c-text{color:var(--ink-2)}
.c-acts{display:flex;flex-wrap:wrap;gap:2px;margin-left:-6px}
.act{border:0;background:none;padding:3px 6px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.act:hover{color:var(--ink);background:var(--line)}
.act.arm{color:var(--danger);background:var(--danger-soft)}
.replies{display:grid;gap:10px;margin:2px 0 0 10px;padding-left:12px;border-left:2px solid var(--line)}
.r{display:grid;gap:4px}
.rbox{display:grid;gap:6px;margin-top:2px}
.rbar{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.shut summary{cursor:pointer;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-3);width:max-content}
.shut summary:hover{color:var(--ink)}

.composer{display:grid;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--panel)}
textarea{box-sizing:border-box;width:100%;resize:none;min-height:44px;max-height:200px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:14px;line-height:1.45}
textarea:focus{outline:none;border-color:var(--pencil);box-shadow:0 0 0 3px var(--pencil-soft);background:var(--panel)}
.rbox textarea{min-height:38px;padding:8px 10px;font-size:13.5px}
.hint{margin:0;font-size:12.5px;color:var(--pencil)}
.cbar{display:flex;align-items:center;gap:8px}
.pinbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:500;color:var(--ink-2)}
.pinbtn svg{width:14px;height:14px}
.pinbtn[aria-pressed="true"],.pinbtn.has{border-color:var(--pencil);color:var(--pencil);background:var(--pencil-soft)}
.post{margin-left:auto;border:0;border-radius:8px;padding:7px 16px;background:var(--pencil);color:var(--pencil-ink);font-size:13px;font-weight:600}
.post:disabled{opacity:1;background:var(--raise);color:var(--ink-3);cursor:default}
.post-sm{margin-left:0;padding:5px 12px;font-size:12.5px}

@media (max-width:759.98px){
  .app,.app.has-rail,.app.rail-docked{display:block;padding-block:12px calc(var(--peek) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px))}
  .rail{display:none}
  .stage{height:100%}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:20;height:78dvh;border-radius:16px 16px 0 0;border-bottom:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom,0px)));transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .sheet-open .panel{transform:none}
  .peek{display:grid;align-content:start;gap:8px;flex:none;height:var(--peek);box-sizing:border-box;padding:8px 18px 0;border:0;background:none;text-align:left}
  .grab{justify-self:center;width:36px;height:4px;border-radius:2px;background:var(--line)}
  .peek-row{display:flex;align-items:baseline;gap:8px;min-width:0}
  .peek-title{font-weight:650}
  .peek-screen{min-width:0;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .peek-count{flex:none;margin-left:auto;font:11.5px/1 var(--sans);color:var(--pencil)}
  .sheet-open .peek-row{display:none}
  .sheet-open .peek{height:32px}
  .act{padding:8px 10px}
  .c-acts{gap:6px}
  .seg button,.vbtn{padding:8px 12px}
  .scrim{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
  .scrim[hidden]{display:none}
}
@media (prefers-reduced-motion:reduce){.rail-menu,.rail.open .rail-menu,.rail.docked .rail-menu,.rail-btn .chev,.panel,.pin-shape,.c{transition:none}.c.flash{animation:none}}
</style>

<nav class="rail" data-kit="rail" aria-label="Screens" hidden>
  <button type="button" class="rail-btn" aria-expanded="false" aria-controls="rail-menu"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 4.5h8M6.5 9h8M6.5 13.5h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="3.25" cy="4.5" r="1" fill="currentColor"/><circle cx="3.25" cy="9" r="1" fill="currentColor"/><circle cx="3.25" cy="13.5" r="1" fill="currentColor"/></svg><span>Screens</span><svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.5 3.5 9 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="rail-menu" id="rail-menu"></div>
</nav>
<div class="app">
  <main class="stage">
    <div class="frame-wrap">
      <iframe data-kit="frame" title="Prototype"></iframe>
      <div class="pins"></div>
      <div class="capture" tabindex="-1" hidden></div>
      <div class="stage-msg" hidden><div><p></p><button type="button" class="btn" hidden>Retry</button></div></div>
    </div>

      <span class="grab" aria-hidden="true"></span>
      <span class="peek-row"><span class="peek-title">Feedback</span><span class="peek-screen"></span><span class="peek-count mono"></span></span>
    </button>
    <div class="panel-body" id="panel-body">
      <header class="ph">
        <div class="ph-row">
          <h1 class="ph-title">Prototype</h1>

            <div class="vlist" role="menu" aria-label="Versions" hidden></div>
          </div>
        </div>
        <p class="ph-old" hidden><span></span> · <button type="button" class="link">Back to latest</button></p>
        <details class="vnotes" hidden><summary></summary><div class="vnotes-body"></div></details>
      </header>
      <div class="sbar">
        <div class="sbar-main"><span class="sbar-title" data-kit="screen">…</span><span class="sbar-count mono"></span></div>
        <div class="seg" role="group" aria-label="Show feedback for">
          <button type="button" data-kit="scope" data-scope="screen" aria-pressed="true">This screen</button>
          <button type="button" data-kit="scope" data-scope="all" aria-pressed="false">All</button>

          <button type="button" class="pinbtn" data-kit="pin-toggle" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 13s4.5-4.2 4.5-7.3A4.5 4.5 0 0 0 2.5 5.7C2.5 8.8 7 13 7 13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="7" cy="5.8" r="1.4" fill="currentColor"/></svg><span>Pin</span></button>
          <button type="submit" class="post" data-kit="submit" disabled>Post</button>
        </div>
      </form>
    </div>
  </aside>
  <div class="scrim" hidden></div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);

    else if (S.menu) { e.preventDefault(); closeMenu(true); }
    else if (S.placing) { e.preventDefault(); setPlacing(false); }
    else if (S.sheet && isNarrow()) { e.preventDefault(); setSheet(false); peek.focus(); }
  });
  $('.ph-old .link').addEventListener('click', () => { const top = latest(); if (top && top !== S.cur) openVersion(top, true); });
  for (const b of document.querySelectorAll('[data-kit="scope"]')) {
    b.addEventListener('click', () => {
      S.scope = b.dataset.scope === 'all' ? 'all' : 'screen';
      sset('localStorage', 'kit:scope', S.scope);
      list.scrollTop = 0;
      render();
    });
  }
  composer.addEventListener('input', () => { grow(composer); submitBtn.disabled = S.posting || !S.screen || !composer.value.trim(); });
  composer.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); post(); } });
  form.addEventListener('submit', (e) => { e.preventDefault(); post(); });
  pinToggle.addEventListener('click', () => {
    if (S.draft && !S.placing) { S.draft = null; render(); return; }
    setPlacing(!S.placing);
  });
  setInterval(() => { if (!document.hidden && !S.rq) scheduleRender(); }, 60000);

  S.scope = sget('localStorage', 'kit:scope') === 'all' ? 'all' : 'screen';
  S.rail.hidden = sget('localStorage', 'kit:rail') === 'hidden';
  syncSheet();
  render();
  loadAdapters().then(loadManifest);
  connect();
})();
</script>
