<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>sam.toys — things I build</title>
<style>
  :root{
    --bg:#0b0b0f; --card:#15151c; --card-hi:#1d1d27; --line:#26262f;
    --text:#f0efe9; --dim:#9a99a6; --accent:#ffb454; --accent-2:#8b7cff;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255,180,84,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 0%, rgba(139,124,255,.10), transparent 55%),
      var(--bg);
    color:var(--text); min-height:100dvh;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:64px 20px 80px}
  @media (max-width:640px){.wrap{padding:44px 16px 60px}}

  header{margin-bottom:14px}
  .mark{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .mark .dot{color:var(--accent)}
  .tag{color:var(--dim);font-size:17px;margin-top:12px;max-width:46ch}
  .tag b{color:var(--text);font-weight:600}

  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    font-weight:700;margin:48px 0 16px}

  /* ── toys: compact text cards ─────────────── */
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  @media (min-width:560px){.grid{grid-auto-rows:1fr}}
  .card{
    position:relative;display:flex;flex-direction:column;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 18px 16px;text-decoration:none;color:inherit;
    transition:transform .16s ease,border-color .16s ease,background .16s ease;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--dot,var(--accent));opacity:.85}
  .card:hover{transform:translateY(-3px);background:var(--card-hi);border-color:#37363f}
  .card:focus-visible,.build:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .name{text-wrap:balance;font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card .desc{text-wrap:balance;color:var(--dim);font-size:14px;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .card .host,.build .host{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .card .arrow,.build .arrow{flex:none;color:var(--dim);transition:transform .16s ease}
  .card:hover .arrow,.build:hover .arrow{transform:translate(2px,-2px);color:var(--text)}

  /* ── bigger builds: screenshot cards ──────── */
  .builds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .build{display:flex;flex-direction:column;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    transition:transform .16s ease,border-color .16s ease}
  .build:hover{transform:translateY(-4px);border-color:#3a3a45}
  .shot{aspect-ratio:16/10;width:100%;object-fit:cover;object-position:top center;display:block;
    background:#0e0e14;border-bottom:1px solid var(--line)}
  .shot.brand{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .shot.brand img{width:28%;height:auto;aspect-ratio:1;border-radius:22%;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  .shot.brand.plain img{width:30%;border-radius:0;box-shadow:none}
  .build .body{flex:1;padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px}
  .build .name{text-wrap:balance;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;letter-spacing:-.01em}
  .build .logo{width:18px;height:18px;border-radius:5px;background:#fff;object-fit:contain;flex-shrink:0;
    box-shadow:0 0 0 1px var(--line)}
  .build .desc{text-wrap:balance;flex:1;color:var(--dim);font-size:13px;line-height:1.4}
  .build .mono{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#0e0e14;line-height:1}
  .build .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor}
  .badge.new{color:var(--accent)} .badge.lock{color:var(--accent-2)}

  @media (max-width:520px){.builds{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.build .body{padding:8px 10px 9px;gap:4px}.build .name{font-size:14px;gap:6px}.build .logo{width:16px;height:16px}.build .mono{font-size:10px}.build .desc{font-size:12px}}
  @media (prefers-reduced-motion:reduce){.card,.build{transition:none}.card:hover,.build:hover{transform:none}}
  footer{margin-top:56px;color:var(--dim);font-size:13px;line-height:1.7}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">sam<span class="dot">.</span>toys</div>
    <p class="tag"><b>Things I build.</b> Little tools, weekend experiments, and a few that grew up.</p>
  </header>

  <h2>Bigger builds</h2>
  <div class="builds" id="builds"></div>

  <h2>Toys &amp; experiments</h2>
  <div class="grid" id="toys"></div>

  <footer>
    Made by Sam. Some of these are just for me — say hi if one’s useful.
  </footer>
</div>

<script>
(function(){
  // Curated from Cod's showcase (2026-11-05). Newest activity first. Edit here to add/remove.
  var TOYS=[
    {name:"Tracks", desc:"Buy what you stream, find what you spin — Spotify to Beatport & back.", url:"/tracks", host:"sam.toys/tracks", dot:"#01ff95", badge:"new", internal:true},
    {name:"Voicenotes", desc:"Drop a WhatsApp voice note, get the gist in bullets.", url:"/voicenotes", host:"sam.toys/voicenotes", dot:"#25d366", internal:true},
    {name:"Out / London", desc:"London’s best bars, music, art & tables, ranked monthly by AI.", url:"/ldn", host:"sam.toys/ldn", dot:"#e0559b", internal:true},
    {name:"Co-produce", desc:"An AI co-producer that lives inside Ableton Live — fat basslines, clean sessions.", url:"/coproduce", host:"sam.toys/coproduce", dot:"#00e0c6", internal:true},
    {name:"Phone", desc:"A browser softphone — make & take calls, powered by Twilio.", url:"/phone", host:"sam.toys/phone", dot:"#4f9dff", internal:true},
    {name:"Tantra", desc:"The Loom of Union — a tantra journey in ink & gold.", url:"/tantra", host:"sam.toys/tantra", dot:"#c9a227", internal:true}
  ];
  var BUILDS=[
    {name:"Chillin", desc:"Hand off the support calls you would rather avoid.", url:"https://chillin.fun", host:"chillin.fun", shot:"/assets/shots/chillin.jpg", logo:false},
    {name:"Vroom", desc:"Find your next car with a few sliders.", url:"https://vroom.fan", host:"vroom.fan", shot:"/assets/shots/vroom.jpg"},
    {name:"UGAME", desc:"Immersive events in Ibiza, Burning Man and London.", url:"https://ugame.events", host:"ugame.events", shot:"/assets/shots/ugame.jpg", logo:"/assets/logos/ugame.svg"},
    {name:"Life, the Universe & Everything", desc:"One night under a total eclipse in Ibiza.", url:"https://www.theultimatequestion.guide", host:"theultimatequestion.guide", brand:"linear-gradient(135deg,#0B1440,#1B2A6B)", plain:true, logo:"/assets/logos/lue.svg", mark:"/assets/logos/lue-mark.svg"},
    {name:"TradeGG", desc:"Bull case, catch and verdict on any ticker.", url:"https://trd.fun", host:"trd.fun", shot:"/assets/shots/trd.jpg"},
    {name:"Sparkli", desc:"Partnership research and brand intelligence for sponsorship.", url:"https://www.sparkli.fun", host:"sparkli.fun", brand:"linear-gradient(135deg,#1D1538,#16224A)", logo:"/assets/logos/sparkli.svg", badge:"lock"},
    {name:"Splittt", desc:"Turn a talk idea into a set of visuals.", url:"https://splitt.fun", host:"splitt.fun", shot:"/assets/shots/splittt.jpg"},
    {name:"Taotime", desc:"Taoism, the I Ching and daily stillness.", url:"https://taotime.me", host:"taotime.me", shot:"/assets/shots/taotime.jpg", logo:"/assets/logos/taotime.svg"},
    {name:"The Brief Brief", desc:"Your world, briefed by AI every morning.", url:"https://tbb.ceo", host:"tbb.ceo", shot:"/assets/shots/tbb.jpg", logo:"/assets/logos/tbb.svg"},
    {name:"Finca", desc:"Browse beautiful Ibiza homes.", url:"https://finca.fan", host:"finca.fan", shot:"/assets/shots/finca.jpg"},
    {name:"Bijou", desc:"A private, map-first shortlist of Paris homes.", url:"https://bijou.fan", host:"bijou.fan", brand:"#F1E8D4", logo:"/assets/logos/bijou.svg", badge:"lock"},
    {name:"DrFit", desc:"Your health dashboard with AI insights.", url:"https://drfit.tips", host:"drfit.tips", shot:"/assets/shots/drfit.jpg"},
    {name:"Drift & Sea", desc:"Distinctive properties in London and Ibiza.", url:"https://driftsea.co", host:"driftsea.co", shot:"/assets/shots/driftsea.jpg"},
    {name:"Flick", desc:"A private film recommender for friends.", url:"https://flick.fan", host:"flick.fan", shot:"/assets/shots/flick.jpg", logo:false},
    {name:"Hike Fan", desc:"Find your next hike in Ibiza.", url:"https://hike.fan", host:"hike.fan", shot:"/assets/shots/hike.jpg"},
    {name:"Knomi", desc:"Steady awareness in ten short stages.", url:"https://knomi.club", host:"knomi.club", shot:"/assets/shots/knomi.jpg", logo:"/assets/logos/knomi.png"},
    {name:"Seer", desc:"AI League of Legends draft & post-game coaching.", url:"https://seer.coach", host:"seer.coach", shot:"/assets/shots/seer.jpg", badge:"lock"},
    {name:"Materiality", desc:"An infinite mood board of interior materials.", url:"https://materiality.cc", host:"materiality.cc", shot:"/assets/shots/materiality.jpg", logo:"/assets/logos/materiality.svg"}
  ];
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function badgeHtml(b){ if(b==="new")return '<span class="badge new">new</span>'; if(b==="lock")return '<span class="badge lock">invite</span>'; return ''; }
  function attrs(it){ return it.internal ? '' : ' target="_blank" rel="noopener noreferrer"'; }

  function renderToys(items){
    var frag=document.createDocumentFragment();
    items.forEach(function(it){
      var a=document.createElement('a');
      a.className='card'; a.href=it.url; a.style.setProperty('--dot', it.dot||'var(--accent)');
      if(!it.internal){ a.target='_blank'; a.rel='noopener noreferrer'; }
      a.innerHTML=
        '<div class="name">'+esc(it.name)+' '+badgeHtml(it.badge)+'</div>'+
        '<div class="desc">'+esc(it.desc)+'</div>'+
        '<div class="foot"><span class="host">'+esc(it.host)+'</span><span class="arrow">↗</span></div>';
      frag.appendChild(a);
    });
    document.getElementById('toys').appendChild(frag);
  }
  function renderBuilds(items){
    var frag=document.createDocumentFragment();
    items.forEach(function(it){
      var a=document.createElement('a');
      a.className='build'; a.href=it.url; a.target='_blank'; a.rel='noopener noreferrer';
      var fav='https://www.google.com/s2/favicons?domain='+encodeURIComponent(it.host)+'&sz=64';
      var logo=it.logo===false
        ? '<span class="logo mono" aria-hidden="true">'+esc(it.name.charAt(0))+'</span>'
        : '<img class="logo" loading="lazy" alt="" src="'+esc(it.logo||fav)+'">';
      a.innerHTML=
        (it.brand
          ? '<div class="shot brand'+(it.plain?' plain':'')+'" style="background:'+esc(it.brand)+'"><img loading="lazy" decoding="async" alt="" src="'+esc(it.mark||it.logo)+'"></div>'
          : '<img class="shot" loading="lazy" decoding="async" alt="" src="'+esc(it.shot)+'">')+
        '<div class="body">'+
          '<div class="name">'+logo+esc(it.name)+' '+badgeHtml(it.badge)+'</div>'+
          '<div class="desc">'+esc(it.desc)+'</div>'+
          '<div class="foot"><span class="host">'+esc(it.host)+'</span><span class="arrow">↗</span></div>'+
        '</div>';
      frag.appendChild(a);
    });
    document.getElementById('builds').appendChild(frag);
  }
  renderBuilds(BUILDS);
  renderToys(TOYS);
})();
</script>
</body>
</html>
