<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Playa · Every burn</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14110e;
        --panel: #1d1813;
        --line: #3a3229;
        --text: #ece4d6;
        --dim: #a39886;
        --accent: #ff6a2b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px system-ui,
          sans-serif;
      }
      button,
      a,
      input {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        color: inherit;
        cursor: pointer;
        background: none;
        border: 0;
        min-width: 44px;
        min-height: 44px;
        padding: 8px 12px;
        border-radius: 6px;
        text-align: left;
      }
      button:hover,
      a:hover {
        background: #2a241d;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      a {
        color: var(--text);
        display: inline-flex;
        align-items: center;
        vertical-align: middle;
        min-height: 44px;
        padding: 8px;
        text-decoration: none;
      }
      [hidden] {
        display: none !important;
      }
      .mono,
      .dim {
        font-family: ui-monospace, monospace;
        color: var(--dim);
        font-size: 12px;
      }
      .accent {
        color: var(--accent);
      }
      header {
        height: 64px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand {
        letter-spacing: 3px;
        font-weight: 800;
      }
      .brand b {
        font: 22px monospace;
        color: var(--accent);
        margin-right: 12px;
      }
      .spacer {
        flex: 1;
      }
      #layout {
        display: flex;
        height: calc(100dvh - 64px);
      }
      main {
        flex: 1;
        min-width: 0;
        overflow: auto;
        padding: 28px 40px 36px;
      }
      h1 {
        font-size: clamp(36px, 5vw, 64px);
        line-height: 1;
        letter-spacing: -1.5px;
        margin: 8px 0 18px;
      }
      h2 {
        font-size: 18px;
        margin: 0;
      }
      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 24px;
        font-size: 14px;
        padding: 8px 16px;
      }
      .chip[aria-pressed='true'],
      .selected {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      #years {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }
      .card {
        position: relative;
        height: 282px;
        overflow: hidden;
        background: var(--panel);
        padding: 0;
        width: 100%;
        border-radius: 4px;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.82;
        transition: transform 0.5s;
      }
      .card:hover img {
        transform: scale(1.04);
      }
      .card:after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, rgba(12, 10, 8, 0.94), transparent 70%);
      }
      .cardtext {
        position: absolute;
        z-index: 1;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 10px;
      }
      .cardtext strong {
        font-size: 46px;
        letter-spacing: -1.5px;
      }
      .cardtext span {
        font:
          12px ui-monospace,
          monospace;
      }
      #grid {
        position: relative;
        margin-top: 16px;
      }
      .cell {
        position: absolute;
        background: var(--panel);
        border-radius: 3px;
        overflow: hidden;
      }
      .tile {
        padding: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
        overflow: hidden;
      }
      .tile img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .tile:hover img {
        transform: scale(1.03);
      }
      .cell.chosen {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .add {
        position: absolute;
        right: 6px;
        top: 6px;
        border-radius: 50%;
        background: rgba(12, 10, 8, 0.85);
        font-size: 22px;
      }
      .badges {
        pointer-events: none;
        position: absolute;
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-block;
        background: #0c0a08cc;
        color: var(--text);
        padding: 4px 7px;
        border: 1px solid var(--line);
        border-radius: 3px;
        font:
          11px ui-monospace,
          monospace;
        letter-spacing: 1px;
      }
      .badge.select {
        border-color: var(--text);
      }
      aside {
        width: 300px;
        flex-shrink: 0;
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--panel);
        padding: 16px;
      }
      aside .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #shortScroll {
        overflow: auto;
        flex: 1;
        min-height: 60px;
        margin: 12px 0;
      }
      #shortItems {
        position: relative;
      }
      .srow {
        position: absolute;
        height: 76px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .srow .open {
        flex: 1;
        padding: 4px;
        display: flex;
        gap: 10px;
        align-items: center;
        min-width: 0;
      }
      .srow img {
        width: 68px;
        height: 52px;
        object-fit: cover;
      }
      .srow span {
        font-size: 12px;
      }
      .srow .remove {
        font-size: 22px;
      }
      .download {
        border: 1px solid var(--line);
        font-size: 13px;
      }
      .download-wrap {
        position: relative;
        width: auto;
        max-width: 100%;
      }
      .download-wrap details > summary {
        cursor: pointer;
        list-style: none;
        min-height: 44px;
        padding: 12px 16px;
        border-radius: 24px;
        font-size: 14px;
      }
      .download-wrap summary::-webkit-details-marker {
        display: none;
      }
      #shortDownload, #shortDownload summary {
        width: 100%;
      }
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .download-options {
        position: absolute;
        z-index: 3;
        bottom: 100%;
        left: 0;
        width: 184px;
        padding: 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 24px #0008;
      }
      .download-options > * {
        display: flex;
        width: 100%;
        min-height: 44px;
        padding: 10px;
      }
      .download-status {
        display: block;
        min-height: 36px;
        margin: 4px 0 0;
        font-size: 12px;
        color: var(--dim);
        overflow-wrap: anywhere;
      }
      .download-status a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 4px;
        color: var(--accent);
        text-decoration: underline;
        font-size: 13px;
      }
      #photoDownload .download-status {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        min-height: 0;
      }
      #shortDownload .download-status {
        min-height: 44px;
      }
      #status {
        line-height: 1.6;
        color: var(--dim);
      }
      #saveState {
        font-size: 12px;
        min-height: 36px;
        color: var(--dim);
      }
      dialog {
        border: 1px solid var(--line);
        padding: 0;
        background: #0c0a08;
        color: var(--text);
        width: min(1200px, 98vw);
        max-width: 98vw;
        height: 94dvh;
        max-height: 94dvh;
      }
      dialog::backdrop {
        background: #000c;
      }
      .lightbox {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .lbtop {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        gap: 12px;
      }
      .stage {
        flex: 1;
        min-height: 80px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
      }
      .stage button {
        flex-shrink: 0;
        font-size: 24px;
      }
      .stage img {
        width: 100%;
        height: 100%;
        min-width: 0;
        object-fit: contain;
      }
      .details {
        padding: 12px 28px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .metadata {
        flex: 1;
        min-width: 160px;
      }
      .metadata p {
        margin: 5px 0;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      #tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      #filmstrip {
        display: flex;
        justify-content: center;
        gap: 6px;
        padding: 8px 16px;
        overflow: hidden;
      }
      #filmstrip button {
        padding: 0;
        flex: 0 1 76px;
        height: 52px;
        min-width: 44px;
        overflow: hidden;
      }
      #filmstrip img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #filmstrip .current {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .keys {
        text-align: center;
        padding: 0 8px 10px;
        font:
          11px ui-monospace,
          monospace;
        color: var(--dim);
      }
      @media (min-width: 1500px) {
        #years {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
      }
      @media (max-width: 900px) {
        main {
          padding: 24px 20px;
        }
        aside {
          width: 260px;
        }
        .intro {
          display: block;
        }
        .intro .dim {
          margin-top: 14px;
        }
        .desktop {
          display: none;
        }
      }
      @media (max-width: 650px) {
        header {
          padding: 0 12px;
          gap: 4px;
        }
        .brand b {
          margin-right: 6px;
        }
        #crumb {
          display: none;
        }
        main {
          padding: 20px 14px;
        }
        #years {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .card {
          height: 240px;
        }
        .cardtext strong {
          font-size: 40px;
        }
        aside {
          position: fixed;
          z-index: 2;
          right: 0;
          top: 64px;
          bottom: 0;
          width: min(340px, 100vw);
          box-shadow: -12px 0 28px #0008;
        }
        .details {
          padding: 8px 12px;
          gap: 8px;
        }
        .stage {
          padding: 0;
          gap: 0;
        }
        .stage button {
          padding: 4px;
        }
        .lbtop {
          padding: 4px 8px;
        }
        #filmstrip {
          padding: 8px;
        }
        .keys {
          display: none;
        }
        h1 {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="#home" aria-label="Playa, all years"><b>)'(</b>PLAYA</a
      ><a id="crumb" class="mono" href="#home">/ All years</a><span class="spacer"></span
      ><button id="shortToggle" aria-expanded="true" aria-controls="shortlist">Shortlist <span id="shortCount">0</span></button
      ><a href="/playa?logout" class="mono">Log out</a>
    </header>
    <div id="layout">
      <main id="main" tabindex="-1">
        <p id="status" role="status">Loading your gallery…</p>
        <section id="home" hidden>
          <div class="intro">
            <h1>Every burn</h1>
            <div id="totals" class="dim"></div>
          </div>
          <p class="mono">ACROSS ALL YEARS</p>
          <div id="collections" class="chips"></div>
          <div id="years"></div>
        </section>
        <section id="browse" hidden>
          <a href="#home" class="mono">← All years</a>
          <div class="intro">
            <h1 id="browseTitle"></h1>
            <div id="browseCount" class="dim"></div>
          </div>
          <div id="filters" class="chips"></div>
          <button id="allPicks" class="chip">Shortlist all AI picks</button>
          <p id="empty" class="dim" hidden>No photos match this filter.</p>
          <div id="grid" role="list" aria-label="Photos"></div>
        </section>
      </main>
      <aside id="shortlist" aria-label="Shortlist">
        <div class="heading">
          <h2>Your shortlist</h2>
          <button id="shortClose" aria-label="Close shortlist">×</button>
        </div>
        <p class="dim">Your favourites, across every burn.</p>
        <div id="shortScroll"><div id="shortItems" role="list"></div></div>
        <p id="saveState" role="status">Loading shortlist…</p>
        <button id="retry" class="chip" hidden>Retry saving</button
        >
        <div id="shortDownload" class="download-wrap">
          <details><summary class="download">↓ Download</summary><div class="download-options"></div></details>
          <div class="download-status" role="status" aria-live="polite"></div>
        </div>
      </aside>
    </div>
    <dialog id="lightbox" aria-label="Photo viewer">
      <div class="lightbox">
        <div class="lbtop">
          <button id="closePhoto">← Back to gallery</button><span class="spacer"></span><span id="position" class="mono"></span
          ><button id="closeX" aria-label="Close photo">×</button>
        </div>
        <div class="stage">
          <button id="previous" aria-label="Previous photo">←</button><img id="preview" alt="" /><button
            id="next"
            aria-label="Next photo"
          >
            →
          </button>
        </div>
        <div class="details">
          <div class="metadata">
            <strong id="photoTitle"></strong>
            <p id="selectSource"></p>
            <p id="aiReason"></p>
            <div id="tags"></div>
          </div>
          <div id="photoDownload" class="download-wrap">
            <details><summary class="download">↓ Download</summary><div class="download-options"></div></details>
            <div class="download-status" role="status" aria-live="polite"></div>
          </div>
          <button id="togglePhoto" class="chip"></button>
        </div>
        <div id="filmstrip"></div>
        <div class="keys">← → navigate · S shortlist · Esc close</div>
      </div>
    </dialog>
    <script nonce="__PLAYA_NONCE__">
      'use strict';
      const $ = (id) => document.getElementById(id);
      const ID = /^[0-9a-f]{64}$/;
      const labels = { all: 'All', picks: 'AI picks', art: 'Art', scenery: 'Scenery', people: 'People', selects: 'Your selects' };
      const state = {
        photos: [],
        byId: new Map(),
        years: [],
        ready: false,
        list: [],
        route: null,
        current: null,
        short: new Set(),
        base: [],
        etag: null,
        pending: [],
        saving: false,
        shortReady: false,
        restore: null,
        gridKey: null,
        photoJobs: new Map(),
        shortlistJob: null,
      };
      // Creates DOM content with textContent so runtime labels remain inert.
      function element(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        if (className) node.className = className;
        return node;
      }
      // Creates a keyboard-accessible button with one click action.
      function button(text, action, className) {
        const node = element('button', text, className);
        node.type = 'button';
        node.addEventListener('click', action);
        return node;
      }
      // Builds a gated image URL with catalog dimensions and lazy loading.
      function photoImage(photo, size = 'thumb') {
        const node = element('img');
        node.src = `/playa/m/${size}/${photo.id}.webp`;
        node.alt = '';
        node.loading = 'lazy';
        node.width = photo.w;
        node.height = photo.h;
        return node;
      }
      // Accepts only exactly 64 lowercase hexadecimal characters.
      function validId(id) {
        return typeof id === 'string' && id.length === 64 && ID.test(id);
      }
      // Excludes sensitive photos from AI-pick membership.
      function aiPick(photo) {
        return !!photo.pick && photo.sens !== true;
      }
      // Applies the selected collection or year filter without hiding other photos.
      function matches(photo, filter) {
        if (filter === 'all') return true;
        if (filter === 'picks') return aiPick(photo);
        if (filter === 'selects') return !!photo.sel;
        return photo.t === filter || photo.tags.includes(filter);
      }
      // Parses supported hash routes and falls back to the home view.
      function readRoute() {
        const raw = location.hash.slice(1) || 'home';
        const [path, query = ''] = raw.split('?');
        const [kind, value] = path.split('/');
        const params = new URLSearchParams(query);
        const filter = kind === 'collection' ? value : params.get('filter') || 'all';
        if (!['home', 'year', 'collection'].includes(kind) || !Object.hasOwn(labels, filter))
          return { kind: 'home', filter: 'all' };
        return { kind, value, filter, photo: validId(params.get('photo')) ? params.get('photo') : null };
      }
      // Builds the same hash representation for a view and optional photo.
      function routeHash(route, photo = null) {
        const path = route.kind === 'home' ? 'home' : `${route.kind}/${route.value}`;
        const params = new URLSearchParams();
        if (route.kind === 'year' && route.filter !== 'all') params.set('filter', route.filter);
        if (photo) params.set('photo', photo);
        return '#' + path + (params.size ? '?' + params : '');
      }
      // Updates browser history and renders the selected hash route.
      function go(hash, replace = false) {
        if (replace) {
          history.replaceState(null, '', hash);
          renderRoute();
        } else if (location.hash === hash) renderRoute();
        else location.hash = hash;
      }
      // Remembers the opener before navigating to a photo in the appropriate collection.
      function openPhoto(photo, opener) {
        state.restore = opener || document.activeElement;
        const route =
          state.route.kind === 'home' || !state.list.includes(photo)
            ? { kind: 'collection', value: 'all', filter: 'all' }
            : state.route;
        go(routeHash(route, photo.id));
      }
      // Removes the photo from the hash while keeping its gallery view.
      function closePhoto() {
        for (const menu of $('lightbox').querySelectorAll('.download-wrap details[open]')) menu.open = false;
        go(routeHash(state.route));
      }
      // Restores the opener, rebuilding its virtual grid cell when necessary.
      function restoreFocus() {
        const target = state.restore;
        if (target?.isConnected) target.focus({ preventScroll: true });
        else if (target?.dataset.photo) {
          const photo = state.byId.get(target.dataset.photo);
          const index = state.list.indexOf(photo);
          if (index >= 0) {
            const layout = gridLayout();
            $('main').scrollTop = $('grid').offsetTop - $('main').offsetTop + Math.floor(index / layout.cols) * layout.row;
            drawGrid(true);
          }
          const replacement = document.querySelector(`[data-photo="${target.dataset.photo}"]`);
          (replacement || $('main')).focus({ preventScroll: true });
        } else $('main').focus({ preventScroll: true });
      }
      // Builds year cards and collection counts exclusively from the runtime catalog.
      function renderHome() {
        $('totals').textContent = `${state.years.length} years · ${state.photos.length.toLocaleString()} photos`;
        $('collections').replaceChildren(
          ...['art', 'scenery', 'people', 'selects', 'picks'].map((filter) =>
            button(
              `${labels[filter]} ${state.photos.filter((p) => matches(p, filter)).length.toLocaleString()}`,
              () => go(`#collection/${filter}`),
              'chip',
            ),
          ),
        );
        $('years').replaceChildren(
          ...state.years.map((year) => {
            const photos = state.photos.filter((p) => String(p.y) === year);
            const cover = photos.find((p) => p.sel) || photos.find(aiPick) || photos[0];
            const card = button('', () => go(`#year/${year}`), 'card');
            if (cover) card.append(photoImage(cover));
            const copy = element('div', undefined, 'cardtext');
            copy.append(
              element('strong', year),
              element('span', `${photos.length.toLocaleString()} photos`),
              element('span', `${photos.filter(aiPick).length} AI picks · ${photos.filter((p) => p.sel).length} selects`),
            );
            card.append(copy);
            return card;
          }),
        );
      }
      // Updates the gallery view and opens or closes the hash-selected photo.
      function renderRoute() {
        if (!state.ready) return;
        const route = readRoute();
        const key = `${route.kind}/${route.value}/${route.filter}`;
        const changed = key !== state.gridKey;
        state.route = route;
        $('home').hidden = route.kind !== 'home';
        $('browse').hidden = route.kind === 'home';
        if (changed) {
          state.gridKey = key;
          $('main').scrollTop = 0;
          const source = route.kind === 'year' ? state.photos.filter((p) => String(p.y) === route.value) : state.photos;
          state.list = source.filter((p) => matches(p, route.filter));
          $('browseTitle').textContent = route.kind === 'year' ? route.value : labels[route.filter];
          $('browseCount').textContent = `${state.list.length.toLocaleString()} photos`;
          $('filters').replaceChildren(
            ...Object.entries(labels).map(([filter, label]) => {
              const chip = button(
                `${label} ${source.filter((p) => matches(p, filter)).length.toLocaleString()}`,
                () => go(route.kind === 'year' ? routeHash({ ...route, filter }) : `#collection/${filter}`),
                'chip',
              );
              chip.setAttribute('aria-pressed', String(filter === route.filter));
              return chip;
            }),
          );
          $('empty').hidden = state.list.length !== 0;
          drawGrid(true);
        }
        const current = route.photo && state.list.find((p) => p.id === route.photo);
        state.current = current || null;
        if (current) {
          renderPhoto();
          if (!$('lightbox').open) {
            $('lightbox').showModal();
            $('closePhoto').focus();
          }
        } else if ($('lightbox').open) {
          $('lightbox').close();
          restoreFocus();
        }
      }
      // Computes a stable row height and column count from available width.
      function gridLayout() {
        const width = $('grid').clientWidth;
        const cols = Math.max(2, Math.floor((width + 10) / 230));
        const cell = (width - (cols - 1) * 10) / cols;
        return { cols, cell, row: Math.round(cell * 0.72) + 10 };
      }
      let gridWindow = '';
      // Renders only visible grid rows plus a small overscan window.
      function drawGrid(force = false) {
        if (!state.ready || state.route?.kind === 'home') return;
        const grid = $('grid'),
          main = $('main');
        const { cols, cell, row } = gridLayout();
        const top = grid.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop;
        const first = Math.max(0, Math.floor((main.scrollTop - top) / row) - 2);
        const last = Math.min(Math.ceil(state.list.length / cols), first + Math.ceil(main.clientHeight / row) + 5);
        grid.style.height = `${Math.ceil(state.list.length / cols) * row}px`;
        const key = `${first}/${last}/${cols}/${cell}/${state.gridKey}`;
        if (!force && key === gridWindow) return;
        gridWindow = key;
        const fragment = document.createDocumentFragment();
        for (let index = first * cols; index < Math.min(last * cols, state.list.length); index++) {
          const photo = state.list[index],
            selected = state.short.has(photo.id);
          const cellNode = element('div', undefined, 'cell' + (selected ? ' chosen' : ''));
          Object.assign(cellNode.style, {
            left: `${(index % cols) * (cell + 10)}px`,
            top: `${Math.floor(index / cols) * row}px`,
            width: `${cell}px`,
            height: `${row - 10}px`,
          });
          cellNode.setAttribute('role', 'listitem');
          cellNode.setAttribute('aria-posinset', index + 1);
          cellNode.setAttribute('aria-setsize', state.list.length);
          const open = button('', () => openPhoto(photo, open), 'tile');
          open.dataset.photo = photo.id;
          open.setAttribute('aria-label', `Open photo ${index + 1}, ${photo.y}`);
          open.append(photoImage(photo));
          const badges = element('div', undefined, 'badges');
          if (aiPick(photo)) badges.append(element('span', 'AI PICK', 'badge'));
          if (photo.sel) badges.append(element('span', 'YOUR SELECT', 'badge select'));
          const add = button(selected ? '✓' : '+', () => toggle(photo.id), 'add' + (selected ? ' selected' : ''));
          add.disabled = !state.shortReady;
          add.setAttribute('aria-label', selected ? 'Remove from shortlist' : 'Add to shortlist');
          add.setAttribute('aria-pressed', String(selected));
          cellNode.append(open, badges, add);
          fragment.append(cellNode);
        }
        grid.replaceChildren(fragment);
      }
      // Renders inert metadata and navigation for the current photo.
      function renderPhoto() {
        const photo = state.current;
        if (!photo) return;
        const index = state.list.indexOf(photo);
        const preview = $('preview');
        preview.src = `/playa/m/preview/${photo.id}.webp`;
        preview.width = photo.w;
        preview.height = photo.h;
        preview.alt = `Photo ${index + 1} · ${photo.y}`;
        $('photoTitle').textContent = String(photo.y);
        $('position').textContent = `${index + 1} / ${state.list.length}`;
        $('selectSource').replaceChildren();
        if (photo.sel)
          $('selectSource').append(
            element('span', 'YOUR SELECT', 'badge select'),
            document.createTextNode(` · ${photo.sel_src || 'Selected folder'}`),
          );
        const reason = photo.reason || photo.note;
        $('aiReason').textContent = [Number.isFinite(photo.score) ? `AI score ${photo.score}/10` : '', reason || '']
          .filter(Boolean)
          .join(' · ');
        $('tags').replaceChildren(
          ...[...new Set([photo.t, ...photo.tags].filter(Boolean))].map((tag) => element('span', tag, 'badge')),
        );
        $('togglePhoto').textContent = state.short.has(photo.id) ? '✓ In shortlist' : '+ Add to shortlist';
        $('togglePhoto').setAttribute('aria-pressed', String(state.short.has(photo.id)));
        $('togglePhoto').disabled = !state.shortReady;
        $('previous').disabled = index === 0;
        $('next').disabled = index === state.list.length - 1;
        renderDownloads();
        const first = Math.max(0, Math.min(index - 3, state.list.length - 7));
        $('filmstrip').replaceChildren(
          ...state.list.slice(first, first + 7).map((p) => {
            const item = button('', () => go(routeHash(state.route, p.id), true), p.id === photo.id ? 'current' : '');
            item.setAttribute('aria-label', `Photo ${state.list.indexOf(p) + 1}`);
            item.append(photoImage(p));
            return item;
          }),
        );
      }
      // Moves within the filtered photo list without leaving its bounds.
      function step(delta) {
        const next = state.list[state.list.indexOf(state.current) + delta];
        if (next) go(routeHash(state.route, next.id), true);
      }
      // Applies ordered add/remove operations while preserving unrelated IDs.
      function merge(base, operations) {
        const ids = new Set(base);
        for (const op of operations) {
          if (op.selected) ids.add(op.id);
          else ids.delete(op.id);
        }
        return [...ids];
      }
      // Queues an optimistic shortlist change within the existing item limit.
      function toggle(id) {
        if (!state.shortReady) return;
        if (!state.short.has(id) && state.short.size >= 5000) {
          $('saveState').textContent = 'Shortlist limit reached (5,000).';
          return;
        }
        state.pending.push({ id, selected: !state.short.has(id) });
        state.short = new Set(merge(state.base, state.pending));
        refreshSelections();
        save();
      }
      // Keeps visible shortlist controls synchronized with optimistic state.
      function refreshSelections() {
        drawGrid(true);
        drawShortlist();
        if (state.current) renderPhoto();
      }
      // Renders only the visible shortlist rows plus overscan.
      function drawShortlist() {
        $('shortCount').textContent = state.short.size;
        const ids = [...state.short],
          scroll = $('shortScroll'),
          items = $('shortItems');
        items.style.height = `${ids.length * 76}px`;
        const start = Math.max(0, Math.floor(scroll.scrollTop / 76) - 2);
        const end = Math.min(ids.length, start + Math.ceil(scroll.clientHeight / 76) + 5);
        const nodes = [];
        for (let i = start; i < end; i++) {
          const id = ids[i],
            photo = state.byId.get(id),
            row = element('div', undefined, 'srow');
          row.style.top = `${i * 76}px`;
          row.setAttribute('role', 'listitem');
          const open = button('', () => photo && openPhoto(photo, open), 'open');
          if (photo) {
            open.append(photoImage(photo), element('span', String(photo.y)));
            open.dataset.photo = id;
          } else {
            open.textContent = 'Photo unavailable';
            open.disabled = true;
          }
          open.setAttribute('aria-label', `Open shortlisted photo ${i + 1}`);
          const remove = button('×', () => toggle(id), 'remove');
          remove.setAttribute('aria-label', 'Remove from shortlist');
          row.append(open, remove);
          nodes.push(row);
        }
        items.replaceChildren(...nodes);
        renderDownloads();
      }
      // Uses same-origin credentials and sends expired sessions back to login.
      async function api(url, options = {}) {
        const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...options });
        if (response.status === 401) {
          location.assign('/playa');
          throw new Error('session');
        }
        return response;
      }
      // Accepts only a valid shortlist response before exposing saved selections.
      async function loadShortlist() {
        const response = await api('/playa/api/shortlist');
        if (!response.ok) throw new Error('shortlist');
        const data = await response.json();
        if (!Array.isArray(data.ids) || data.ids.some((id) => !validId(id)) || typeof data.etag !== 'string')
          throw new Error('shortlist');
        return data;
      }
      // Serializes optimistic writes and retries a conflict once after merging fresh state.
      async function save() {
        if (state.saving || !state.shortReady || !state.pending.length) return;
        state.saving = true;
        $('retry').hidden = true;
        $('saveState').textContent = 'Saving…';
        try {
          while (state.pending.length) {
            const batch = state.pending.slice();
            let base = state.base,
              etag = state.etag,
              response;
            for (let attempt = 0; attempt < 2; attempt++) {
              const ids = merge(base, batch);
              if (ids.length > 5000) throw new Error('limit');
              response = await api('/playa/api/shortlist', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'If-Match': etag },
                body: JSON.stringify({ ids }),
              });
              if (response.status !== 412 || attempt === 1) break;
              const latest = await loadShortlist();
              base = latest.ids;
              etag = latest.etag;
            }
            if (!response.ok) throw new Error('save');
            const saved = await response.json();
            state.base = saved.ids;
            state.etag = saved.etag;
            state.pending.splice(0, batch.length);
            state.short = new Set(merge(state.base, state.pending));
            refreshSelections();
          }
          $('saveState').textContent = state.short.size
            ? 'Saved across your devices.'
            : 'Add photos with + or press S in the viewer.';
        } catch {
          $('saveState').textContent = 'Changes are not saved yet. Retry before leaving this page.';
          $('retry').hidden = false;
        } finally {
          state.saving = false;
        }
      }
      // Enables shortlist edits only after loading its current server state.
      async function initializeShortlist() {
        try {
          const data = await loadShortlist();
          state.base = data.ids;
          state.etag = data.etag;
          state.short = new Set(data.ids);
          state.shortReady = true;
          $('saveState').textContent = state.short.size
            ? 'Saved across your devices.'
            : 'Add photos with + or press S in the viewer.';
          $('retry').hidden = true;
          refreshSelections();
        } catch {
          $('saveState').textContent = 'Shortlist unavailable. Retry to load it.';
          $('retry').hidden = false;
        }
      }
      // A job keeps its original selection even when the viewer or shortlist changes.
      function downloadJob(kind) {
        return kind === 'photo' ? state.photoJobs.get(state.current?.id) : state.shortlistJob;
      }
      function downloadIds(kind) {
        return kind === 'photo' ? (state.current ? [state.current.id] : []) : [...state.short];
      }
      function pendingDownload(job) {
        return job && ['submitting', 'queued', 'building'].includes(job.state);
      }
      function renderDownloads() {
        for (const kind of ['photo', 'zip']) {
          const wrap = $(kind === 'photo' ? 'photoDownload' : 'shortDownload');
          const ids = downloadIds(kind), job = downloadJob(kind), busy = pendingDownload(job);
          const instant = wrap.querySelector('a[data-instant]');
          if (instant) {
            instant.href = ids[0] ? `/playa/m/dl/2048/${ids[0]}.jpg` : '#';
            const photo = state.byId.get(ids[0]);
            instant.download = photo ? `playa-${photo.y}-${photo.id.slice(0, 10)}.jpg` : '';
            instant.hidden = !ids.length;
          }
          for (const control of wrap.querySelectorAll('button'))
            control.disabled = busy || !ids.length || (kind === 'zip' && (ids.length > 2000 || !state.shortReady));
          const status = wrap.querySelector('.download-status');
          const key = JSON.stringify(job ? [job.ids, job.state, job.done, job.total, job.size, job.url, job.bytes, job.message] : [ids.length > 2000]);
          if (status.dataset.content === key) continue;
          status.dataset.content = key;
          status.replaceChildren();
          if (job) {
            if (busy) {
              const done = Number.isInteger(job.done) ? job.done : 0;
              status.textContent = kind === 'photo' ? 'Preparing…' : `Preparing… ${done}/${job.total}`;
            } else if (job.state === 'ready') {
              const link = element('a', 'Save file');
              link.href = job.url;
              link.download = job.name;
              // A ready link can sit on screen beyond its five-minute grant.
              // Renew it on the same click without buffering the file in JS.
              link.addEventListener('click', async (event) => {
                if (Date.now() - job.signedAt < 4 * 60 * 1000) return;
                event.preventDefault();
                await pollDownload(job);
                if (job.state === 'ready') location.assign(job.url);
              });
              const bytes = Number.isFinite(job.bytes) ? `${Number((job.bytes / 1000000).toFixed(1))} MB` : '';
              status.append(link, document.createTextNode(bytes ? ` · ${bytes}` : ''));
            } else status.textContent = job.state === 'expired' ? 'Expired. Choose a size again.' : job.message;
          } else if (kind === 'zip' && ids.length > 2000) status.textContent = 'Choose up to 2,000 photos.';
        }
      }
      const exportErrors = {
        'too-large': 'This download is too large.',
        'not-published': 'A photo is no longer available.',
        busy: 'Busy. Try again shortly.',
        'export-busy': 'Busy. Try again shortly.',
        integrity: 'Could not prepare this download.',
        'invalid-request': 'Could not prepare this download.',
        internal: 'Could not prepare this download.',
      };
      async function pollDownload(job) {
        try {
          const response = await api(`/playa/api/export/${job.rid}`);
          if (!response.ok) throw new Error('status');
          const data = await response.json();
          if (!['queued', 'building', 'ready', 'failed', 'expired'].includes(data.state)) throw new Error('status');
          job.state = data.state;
          if (Number.isInteger(data.done) && data.done >= 0) job.done = Math.min(data.done, job.total);
          if (data.state === 'ready') {
            const url = new URL(data.url);
            if (url.protocol !== 'https:' || typeof data.name !== 'string') throw new Error('status');
            Object.assign(job, { url: url.href, bytes: data.bytes, name: data.name, signedAt: Date.now() });
          }
          if (data.state === 'failed') job.message = exportErrors[data.error] || exportErrors.internal;
          renderDownloads();
          if (job.state === 'ready' && !job.downloadStarted) {
            job.downloadStarted = true;
            location.assign(job.url);
          }
          if (pendingDownload(job)) setTimeout(() => pollDownload(job), 2000);
        } catch {
          job.state = 'failed';
          job.message = 'Download unavailable. Try again.';
          renderDownloads();
        }
      }
      async function queueDownload(kind, size) {
        if (pendingDownload(downloadJob(kind))) return;
        const ids = downloadIds(kind);
        if (!ids.length || (kind === 'zip' && ids.length > 2000)) return;
        const job = { state: 'submitting', ids: ids.slice(), size, total: ids.length, done: 0 };
        if (kind === 'photo') state.photoJobs.set(ids[0], job);
        else state.shortlistJob = job;
        $(kind === 'photo' ? 'photoDownload' : 'shortDownload').querySelector('details').open = false;
        renderDownloads();
        try {
          const response = await api('/playa/api/export', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, size, ids }),
          });
          const data = await response.json();
          if (response.status !== 202 || !/^[0-9a-f]{32}$/.test(data.rid)) {
            job.message = exportErrors[data.error] || exportErrors.internal;
            job.state = 'failed';
            renderDownloads();
            return;
          }
          job.rid = data.rid;
          job.state = 'queued';
          await pollDownload(job);
        } catch {
          job.state = 'failed';
          job.message = 'Download unavailable. Try again.';
          renderDownloads();
        }
      }
      // Native disclosures keep the size choices reachable by keyboard and touch.
      for (const kind of ['photo', 'zip']) {
        const wrap = $(kind === 'photo' ? 'photoDownload' : 'shortDownload');
        const options = wrap.querySelector('.download-options');
        for (const [size, label] of [['2048', '2048 px'], ['4096', '4096 px'], ['original', 'Original']]) {
          if (kind === 'photo' && size === '2048') {
            const link = element('a', label);
            link.dataset.instant = '';
            link.addEventListener('click', () => { wrap.querySelector('details').open = false; });
            options.append(link);
          } else options.append(button(label, () => queueDownload(kind, size)));
        }
      }
      $('retry').addEventListener('click', () => (state.shortReady ? save() : initializeShortlist()));
      $('allPicks').addEventListener('click', () => {
        if (!state.shortReady) return;
        const source = state.route.kind === 'year' ? state.photos.filter((p) => String(p.y) === state.route.value) : state.photos;
        for (const photo of source.filter(aiPick)) {
          if (!state.short.has(photo.id) && state.short.size < 5000) {
            state.pending.push({ id: photo.id, selected: true });
            state.short.add(photo.id);
          }
        }
        refreshSelections();
        save();
      });
      // Keeps panel visibility, accessibility state and windowed layouts synchronized.
      function showShortlist(show) {
        $('shortlist').hidden = !show;
        $('shortToggle').setAttribute('aria-expanded', String(show));
        drawShortlist();
        drawGrid(true);
      }
      $('shortToggle').addEventListener('click', () => showShortlist($('shortlist').hidden));
      $('shortClose').addEventListener('click', () => {
        showShortlist(false);
        $('shortToggle').focus();
      });
      $('closePhoto').addEventListener('click', closePhoto);
      $('closeX').addEventListener('click', closePhoto);
      $('previous').addEventListener('click', () => step(-1));
      $('next').addEventListener('click', () => step(1));
      $('togglePhoto').addEventListener('click', () => state.current && toggle(state.current.id));
      $('lightbox').addEventListener('cancel', (event) => {
        const menu = $('lightbox').querySelector('.download-wrap details[open]');
        if (menu) {
          event.preventDefault();
          menu.open = false;
          menu.querySelector('summary').focus();
          return;
        }
        event.preventDefault();
        closePhoto();
      });
      $('lightbox').addEventListener('keydown', (event) => {
        const actionFocused = event.target.closest('a, summary, input, .download-wrap, #togglePhoto');
        if (!actionFocused && event.key === 'ArrowLeft') {
          event.preventDefault();
          step(-1);
        }
        if (!actionFocused && event.key === 'ArrowRight') {
          event.preventDefault();
          step(1);
        }
        if (!actionFocused && event.key.toLowerCase() === 's' && !event.ctrlKey && !event.metaKey && !event.altKey) {
          event.preventDefault();
          toggle(state.current.id);
        }
        if (event.key === 'Tab') {
          const buttons = [...$('lightbox').querySelectorAll('button:not(:disabled), a[href], summary')].filter((node) => node.getClientRects().length);
          const first = buttons[0],
            last = buttons.at(-1);
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });
      let frame = false;
      $('main').addEventListener(
        'scroll',
        () => {
          if (!frame) {
            frame = true;
            requestAnimationFrame(() => {
              frame = false;
              drawGrid();
            });
          }
        },
        { passive: true },
      );
      $('shortScroll').addEventListener('scroll', drawShortlist, { passive: true });
      new ResizeObserver(() => {
        drawGrid(true);
        drawShortlist();
      }).observe($('main'));
      window.addEventListener('hashchange', renderRoute);
      window.addEventListener('beforeunload', (event) => {
        if (state.pending.length) {
          event.preventDefault();
          event.returnValue = '';
        }
      });
      showShortlist(!matchMedia('(max-width:650px)').matches);
      (async () => {
        try {
          const response = await api('/playa/api/catalog');
          if (!response.ok) throw new Error('catalog');
          const data = await response.json();
          if (!Array.isArray(data.photos) || !Array.isArray(data.years)) throw new Error('catalog');
          state.photos = data.photos
            .filter(
              (p) =>
                p &&
                validId(p.id) &&
                Number.isFinite(p.w) &&
                p.w > 0 &&
                Number.isFinite(p.h) &&
                p.h > 0 &&
                /^\d{4}$/.test(String(p.y)),
            )
            .map((p) => ({ ...p, tags: Array.isArray(p.tags) ? p.tags : [] }));
          state.byId = new Map(state.photos.map((p) => [p.id, p]));
          state.years = [
            ...new Set(
              [...data.years.map((y) => String(typeof y === 'object' ? y.y : y)), ...state.photos.map((p) => String(p.y))].filter(
                (y) => /^\d{4}$/.test(y),
              ),
            ),
          ].sort();
          state.ready = true;
          $('status').hidden = true;
          renderHome();
          renderRoute();
          await initializeShortlist();
        } catch {
          $('status').textContent = 'Gallery not published yet. Reload to try again.';
          $('saveState').textContent = 'Gallery not published yet.';
        }
      })();
    </script>
  </body>
</html>
